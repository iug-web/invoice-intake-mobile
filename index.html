<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d3b66" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d3b66'/%3E%3Cpath d='M17 19h30v28H17z' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M24 29h16M24 38h10' stroke='%233ec0a0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>入库单据助手</title>
  <style>
    :root{--ink:#122033;--muted:#64748b;--paper:#f4f7fb;--navy:#0d3b66;--mint:#3ec0a0;--line:#dbe4ee;--orange:#ef7c42;}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;line-height:1.45}
    header{background:var(--navy);color:white;padding:20px clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px;font-size:21px;font-weight:700}.mark{width:35px;height:35px;border:2px solid #fff;border-radius:9px;display:grid;place-items:center;color:var(--mint);font-weight:900}.tag{font-size:13px;color:#c9d9e7;border:1px solid #537595;border-radius:100px;padding:5px 10px}
    main{max-width:1300px;margin:28px auto;padding:0 22px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:23px}.intro h1{font-size:31px;margin:0 0 6px;letter-spacing:-.5px}.intro p{margin:0;color:var(--muted)}.steps{display:flex;gap:8px;white-space:nowrap;font-size:13px;color:var(--muted)}.steps span{background:white;border:1px solid var(--line);border-radius:99px;padding:7px 10px}.steps .on{border-color:var(--mint);color:#18725f;background:#effbf8}
    .grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(18,32,51,.04)}.capture{padding:21px}.card h2{font-size:17px;margin:0 0 4px}.hint{font-size:13px;color:var(--muted);margin:0 0 17px}.drop{border:2px dashed #aac1d6;border-radius:12px;min-height:180px;display:grid;place-items:center;text-align:center;padding:22px;background:#f9fcff;cursor:pointer}.drop:hover{border-color:var(--mint);background:#f2fcf9}.camera{font-size:31px;margin-bottom:7px}.drop strong{display:block}.drop small{color:var(--muted);font-size:13px}.preview{display:none;margin-top:14px;position:relative}.preview img{width:100%;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.file-name{font-size:13px;color:var(--muted);word-break:break-all;margin-top:5px}.fields{margin-top:18px}.fields label{font-weight:700;font-size:14px;display:block;margin:12px 0 6px}.fields input,.fields textarea{width:100%;border:1px solid #b9c7d7;border-radius:8px;padding:10px 11px;font:inherit}.fields textarea{height:116px;resize:vertical;font-size:14px}.example{background:none;border:0;color:#176c99;font:inherit;font-size:13px;padding:5px 0;cursor:pointer;text-decoration:underline}
    button{font:inherit;font-weight:700;border-radius:8px;border:0;cursor:pointer;padding:11px 15px}.primary{background:var(--navy);color:#fff;width:100%;margin-top:16px}.primary:hover{background:#0a2d4c}.secondary{background:#eaf4fa;color:#0d3b66}.save{background:var(--mint);color:#073e34}.workspace{padding:21px;min-width:0}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.status{font-size:14px;color:var(--muted)}.status b{color:#1e866f}.empty{border:1px dashed #b9c7d7;border-radius:12px;min-height:350px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.empty .icon{font-size:48px}.results{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.metric{border:1px solid var(--line);border-radius:10px;padding:12px}.metric span{font-size:12px;color:var(--muted);display:block}.metric b{font-size:20px;display:block;margin-top:2px}.warning{display:none;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:9px 11px;border-radius:8px;font-size:13px;margin-bottom:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}th{background:#eff5f9;color:#43556b;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px;border-bottom:1px solid #edf1f5}tr:last-child td{border:0}td input,td select{border:1px solid #c6d2de;border-radius:5px;padding:5px;width:100%;font:inherit;background:#fff}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px;flex-wrap:wrap}.toast{position:fixed;right:24px;bottom:24px;background:#0f3e62;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 8px 20px #0003;transform:translateY(90px);opacity:0;transition:.2s}.toast.show{transform:none;opacity:1}.note{margin-top:18px;font-size:13px;color:var(--muted)}
    @media(max-width:850px){header{padding:15px 20px}.tag{display:none}main{margin:20px auto;padding:0 15px}.intro{align-items:flex-start;display:block}.steps{margin-top:14px;overflow:auto}.grid{grid-template-columns:1fr}.intro h1{font-size:26px}.summary{grid-template-columns:1fr 1fr}}
    @media(max-width:650px){body{font-size:16px}header{padding:12px 16px}.brand{font-size:18px}.brand .mark{width:31px;height:31px}main{margin:14px auto;padding:0 12px}.intro{margin-bottom:14px}.intro h1{font-size:24px}.intro p{font-size:14px}.steps{display:none}.capture,.workspace{padding:15px}.drop{min-height:118px;padding:14px}.camera{font-size:25px;margin-bottom:2px}.hint{margin-bottom:10px}.summary{grid-template-columns:repeat(3,1fr);gap:5px}.metric{padding:9px 7px}.metric b{font-size:16px}.metric span{font-size:12px}.table-wrap{border:0;overflow:visible}table{display:block;min-width:0}thead{display:none}tbody{display:block}tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}td{display:block;border:0;padding:0;min-width:0}td::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;margin-bottom:3px}td:first-child,td:nth-child(2){grid-column:1/-1}td:nth-child(6){align-self:end;padding-bottom:7px}td:last-child{grid-column:1/-1;text-align:right}td:last-child::before{display:none}td input,td select{font-size:16px;padding:9px;min-height:42px}td .del{padding:6px 16px}.actions{position:sticky;bottom:0;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);justify-content:stretch}.actions button{flex:1;min-width:95px;font-size:14px;padding:10px 6px}.note{line-height:1.5}#cameraStart{display:none}}
  </style>
</head>
<body>
<header><div class="brand"><div class="mark">▤</div>入库单据助手</div><div class="tag">手机与电脑浏览器版 · 照片仅在当前设备处理</div></header>
<main>
  <section class="intro"><div><h1>拍单据，生成入库草稿</h1><p>拍照或上传采购单；确认商品、分类、数量和价格后再导出或复制到后台。</p></div><div class="steps"><span class="on">1 上传单据</span><span>2 核对识别</span><span>3 导入后台</span></div></section>
  <section class="grid">
    <aside class="card capture"><h2>单据来源</h2><p class="hint">支持 JPG、PNG 照片和 Excel 订购单。文件仅在当前浏览器中处理。</p>
      <label class="drop" for="photo"><div><div class="camera">▧</div><strong>选择单据照片</strong><small>可选择照片或 Excel 文件，也可拖入文件</small></div></label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,.xlsx" hidden>
      <label class="secondary" for="cameraFile" style="display:block;text-align:center;cursor:pointer;margin-top:10px;padding:11px 15px;border-radius:8px;font-weight:700">手机直接拍照</label><input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>
      <button class="secondary" id="cameraStart" type="button" style="width:100%;margin-top:10px">使用电脑摄像头拍照</button>
      <div id="cameraPane" hidden style="margin-top:12px"><video id="cameraView" autoplay playsinline muted style="width:100%;border-radius:10px;background:#122033"></video><div style="display:flex;gap:8px;margin-top:8px"><button class="save" id="cameraTake" type="button" style="flex:1">拍下单据</button><button class="secondary" id="cameraClose" type="button">关闭</button></div></div>
      <div class="preview" id="preview"><img id="previewImg" alt="单据预览"><div class="file-name" id="fileName"></div></div>
      <div class="fields"><label for="supplier">供应商（可选）</label><input id="supplier" placeholder="例如：示例供应商"><label for="raw">单据文字 / 商品行</label><textarea id="raw" placeholder="每行：商品名 数量 单位 单价&#10;例如：冻虾仁 10 箱 320&#10;可从单据中复制文字，或先点“示例单据”体验。"></textarea><button class="example" id="example">填入示例单据</button></div>
      <button class="primary" id="recognize">识别并生成入库草稿</button>
    </aside>
    <section class="card workspace"><div class="toolbar"><div><h2>待入库明细</h2><div class="status" id="status">等待单据…</div></div><button class="secondary" id="addRow" hidden>+ 添加商品</button></div>
      <div class="empty" id="empty"><div><div class="icon">▤</div><strong>尚未生成入库草稿</strong><br><span>上传单据后，系统将自动建议商品分类。</span></div></div>
      <div class="results" id="results"><div class="warning" id="warning"></div><div class="summary"><div class="metric"><span>商品行数</span><b id="count">0</b></div><div class="metric"><span>建议分类数</span><b id="categories">0</b></div><div class="metric"><span>预计金额</span><b id="total">¥0.00</b></div></div>
        <div class="table-wrap"><table><thead><tr><th>商品名称</th><th>建议分类</th><th>数量</th><th>单位</th><th>单价（元）</th><th>小计</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="actions"><button class="secondary" id="export">导出 CSV</button><button class="secondary" id="copy">复制入库明细</button><button class="save" id="save">保存本地草稿</button></div>
        <p class="note">提示：此版本不会直接提交到二维火，避免错单。确认无误后可导出 CSV 或复制明细；接入正式 API 后可增加“一键生成入库单”。</p>
      </div>
    </section>
  </section>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), rows=$('#rows');
const cats=[[/虾|鱼|蟹|贝|蛏|蚌|蚝|海参|鱿/, '海鲜'],[/牛|羊|猪|鸡|鸭|肉|排骨|火腿/, '肉类'],[/菜|瓜|果|葱|姜|蒜|土豆|番茄|白菜/, '蔬菜水果'],[/油|盐|酱|醋|料|粉|糖|米|面/, '调料粮油'],[/啤酒|白酒|饮料|可乐|矿泉水|牛奶|酸奶|奶茶/, '酒水饮料'],[/纸|手套|洗洁|保鲜|餐盒/, '易耗品'],[/面包|蛋糕|黄油|奶油/, '西点'],[/豆腐|豆皮|腐竹/, '豆制品']];
function category(n){return (cats.find(([x])=>x.test(n))||[])[1]||'待确认'}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function num(x){let v=parseFloat(x);return Number.isFinite(v)?v:0}
function makeRow(d={name:'',cat:'待确认',qty:1,unit:'件',price:0}){let tr=document.createElement('tr');tr.innerHTML='<td><input class="name" aria-label="商品名称"></td><td><select class="cat" aria-label="建议分类"></select></td><td><input class="qty" type="number" min="0" step="0.01" inputmode="decimal" aria-label="数量"></td><td><input class="unit" aria-label="单位"></td><td><input class="price" type="number" min="0" step="0.01" inputmode="decimal" aria-label="单价"></td><td class="subtotal">¥0.00</td><td><button class="secondary del" title="删除" aria-label="删除商品">×</button></td>';['商品名称','建议分类','数量','单位','单价（元）','小计',''].forEach((label,i)=>tr.children[i].dataset.label=label);for(let c of ['海鲜','肉类','蔬菜水果','调料粮油','酒水饮料','豆制品','西点','易耗品','待确认']){let o=document.createElement('option');o.textContent=c;tr.querySelector('.cat').append(o)}tr.querySelector('.name').value=d.name;tr.querySelector('.cat').value=d.cat;tr.querySelector('.qty').value=d.qty;tr.querySelector('.unit').value=d.unit;tr.querySelector('.price').value=d.price;tr.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',refresh));tr.querySelector('.name').addEventListener('input',()=>{if(tr.querySelector('.cat').value==='待确认')tr.querySelector('.cat').value=category(tr.querySelector('.name').value);refresh()});tr.querySelector('.del').onclick=()=>{tr.remove();refresh()};rows.append(tr)}
function data(){return [...rows.children].map(tr=>({name:tr.querySelector('.name').value.trim(),cat:tr.querySelector('.cat').value,qty:num(tr.querySelector('.qty').value),unit:tr.querySelector('.unit').value.trim(),price:num(tr.querySelector('.price').value)})).filter(x=>x.name)}
function refresh(){let d=data(), total=0;[...rows.children].forEach(tr=>{let v=num(tr.querySelector('.qty').value)*num(tr.querySelector('.price').value);tr.querySelector('.subtotal').textContent='¥'+v.toFixed(2);total+=v});$('#count').textContent=d.length;$('#categories').textContent=new Set(d.map(x=>x.cat)).size;$('#total').textContent='¥'+total.toFixed(2);let unsure=d.filter(x=>x.cat==='待确认').map(x=>x.name);$('#warning').style.display=unsure.length?'block':'none';$('#warning').textContent=unsure.length?'请确认分类：'+unsure.join('、'):''}
function show(){ $('#empty').style.display='none';$('#results').style.display='block';$('#addRow').hidden=false;$('#status').innerHTML='<b>草稿已生成</b> · 请核对后再导入后台';refresh()}
$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;$('#fileName').textContent=f.name;if(f.type.startsWith('image/')){let u=URL.createObjectURL(f);$('#previewImg').src=u;$('#preview').style.display='block'}else{$('#preview').style.display='none'}toast('已选择单据：'+f.name)};
$('#example').onclick=()=>{$('#supplier').value='示例供应商';$('#raw').value='冻虾仁 10 箱 320\n巴沙鱼柳 8 箱 185\n五花肉 15 斤 22.5\n可乐 24 箱 48\n洗洁精 6 桶 18';toast('已填入示例单据')};
$('#recognize').onclick=()=>{let text=$('#raw').value.trim();if(!text){toast('请先输入单据文字，或填入示例单据');return}rows.innerHTML='';let parsed=text.split(/\n+/).map(line=>{let p=line.trim().split(/\s+/), name=p[0]||'', q=num(p[1])||1, unit=p[2]||'件',price=num(p[3]);return {name,qty:q,unit,price,cat:category(name)}}).filter(x=>x.name);parsed.forEach(makeRow);show()};
$('#addRow').onclick=()=>{makeRow();show()};
$('#copy').onclick=async()=>{let d=data();if(!d.length)return;let t=['商品名称\t分类\t数量\t单位\t单价\t小计',...d.map(x=>`${x.name}\t${x.cat}\t${x.qty}\t${x.unit}\t${x.price}\t${(x.qty*x.price).toFixed(2)}`)].join('\n');try{await navigator.clipboard.writeText(t);toast('入库明细已复制')}catch{toast('浏览器未允许剪贴板，请用导出 CSV')}};
$('#export').onclick=()=>{let d=data();if(!d.length)return;let esc=x=>'"'+String(x).replaceAll('"','""')+'"';let csv='商品名称,分类,数量,单位,单价,小计\n'+d.map(x=>[x.name,x.cat,x.qty,x.unit,x.price,(x.qty*x.price).toFixed(2)].map(esc).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='入库草稿_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV 已导出')};
$('#save').onclick=()=>{localStorage.setItem('invoiceDraft',JSON.stringify({supplier:$('#supplier').value,rows:data()}));toast('草稿已保存在当前设备浏览器')};
let saved=JSON.parse(localStorage.getItem('invoiceDraft')||'null');if(saved?.rows?.length){$('#supplier').value=saved.supplier||'';saved.rows.forEach(makeRow);show();$('#status').innerHTML='<b>已恢复本地草稿</b> · 请核对后再导入后台'}
</script><script src="vendor/tesseract.min.js"></script><script src="vendor/xlsx.full.min.js"></script><script src="ocr.js"></script></body></html>
