<style>
:root{--bg:#eef1f4;--paper:#fbfcfd;--ink:#1d2733;--muted:#5d6a78;--line:#d5dbe2;
--red:#c8322b;--red-soft:#fbe9e7;--blue:#2f5d8a;--blue-soft:#e4edf6;
--ok:#2e7d4f;--ok-soft:#e3f1e7;--amber:#8a5a00;--amber-soft:#fff2d1;
--f-hand:"Kaiti SC","STKaiti","KaiTi",serif;
--f-body:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
--f-mono:ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--paper:#1c242d;--ink:#e6ebf0;--muted:#97a4b2;--line:#2e3946;
--red:#ff7a6e;--red-soft:#3a2321;--blue:#8db8e3;--blue-soft:#1f2f40;
--ok:#6fcf97;--ok-soft:#1d3326;--amber:#e3b341;--amber-soft:#362c12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body{padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:21px;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
h1 span{font-size:13px;font-weight:400;color:var(--muted);margin-left:auto}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rn{font-size:17px;font-weight:600;font-family:var(--f-hand)}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;border-radius:99px;padding:1px 9px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-maybe{background:var(--amber-soft);color:var(--amber)}.t-no{background:var(--red-soft);color:var(--red)}
select,input,textarea,button{font:inherit;color:var(--ink)}
select{width:100%;margin-top:7px;font-size:16px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
input[type=text],input[type=password],textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;background:var(--bg);border-top:1px solid var(--line);
padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));z-index:9}
.bar button{flex:1;min-width:0}
button{padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px}
button:active{opacity:.7}
button.red{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pick label{display:grid;place-items:center;gap:6px;padding:24px 10px;border:1.5px dashed var(--line);border-radius:14px;background:var(--paper);text-align:center;cursor:pointer}
.pick label:active{border-color:var(--blue);background:var(--blue-soft)}
.pick .ic{font-size:30px}
.pick b{font-size:16px}
.pick s{text-decoration:none;color:var(--muted);font-size:12px}
input[type=file]{display:none}
img.shot{width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
pre{white-space:pre-wrap;word-break:break-all;font:12px/1.5 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px;margin:0}
.dim{color:var(--muted);font-size:13px}
.err{color:var(--red)}
.ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--red-soft);color:var(--red);border-radius:99px;padding:2px 10px;font-size:14px}
label.ck{display:flex;gap:10px;align-items:flex-start}
label.ck input{width:22px;height:22px;accent-color:var(--red);margin:2px 0 0}
s.old{color:var(--muted)}
b.new{color:var(--red)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin:10px 0}
.tab{flex:1;padding:9px 4px;border:0;background:transparent;border-radius:9px;font-size:15px;color:var(--muted);position:relative}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tab i{font-style:normal;font-size:11px;margin-left:3px;background:var(--red);color:#fff;border-radius:99px;padding:0 5px;vertical-align:1px}
.tab.on i{background:var(--bg);color:var(--ink)}
.mchip{padding:7px 14px;border:1px solid var(--line);background:var(--paper);border-radius:99px;font-size:14px}
.mchip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
label.addp{display:inline-flex;align-items:center;justify-content:center;padding:12px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:15px;cursor:pointer}
.card .row button{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>

    if (c[0] === "#" || /^#/.test(c[0])) { head = { type: c[1] || "", supplier: c[2] || "", date: c[3] || "", total: c[4] || "" }; return; }
    if (/序\s*号/.test(c[0]) || /品\s*名/.test(c[1] || "")) return;
    var o = 0, no = rows.length + 1;
    if (/^\d{1,3}$/.test(c[0])) { no = +c[0]; o = 1; }
    var g = function (k) { return (c[o + k] || "").replace(/^[—〃"]+$/, "").trim(); };
    var hand = g(0);
    if (!hand || /^[—\s]*$/.test(hand)) return;
    rows.push({ no: no, hand: hand, unit: g(1), qty: g(2), actual: g(3), price: g(4), amount: g(5), code: g(6), spec: g(7) });
  });
  if (!rows.length) throw new Error("没读出表格。AI 回答开头：" + txt.replace(/\s+/g, " ").slice(0, 160));
  var last = ""; rows.forEach(function (r) { if (r.unit) last = r.unit; else r.unit = last; });
  var seen = {};
  rows = rows.filter(function (r) { if (seen[r.no]) return false; seen[r.no] = 1; return true; }).sort(function (a, b) { return a.no - b.no; });
  return { date: head.date || "", supplier: head.supplier || "", type: head.type || "", total: head.total || "", rows: rows };
}

/* ---------- 金额核对 ---------- */
function num(v) { var t = String(v == null ? "" : v).replace(/[，,元¥\s]/g, ""); if (!t) return NaN;
  if (/^[\d.]+(\+[\d.]+)+$/.test(t)) return t.split("+").reduce(function (a, b) { return a + parseFloat(b); }, 0); return parseFloat(t); }
function r2(x) { return Math.round(x * 100) / 100; }
function rowCheck(r) {
  var q = num(r.actual) || num(r.qty), p = num(r.price), a = num(r.amount);
  if (!isFinite(p) || !isFinite(q)) return { ok: null, txt: "", calc: isFinite(a) ? a : 0 };
  var c = r2(q * p);
  if (!isFinite(a)) return { ok: null, txt: "应为 " + c, calc: c };
  return Math.abs(c - a) < 0.01 ? { ok: true, txt: "✓", calc: c } : { ok: false, txt: "应为 " + c, calc: c };
}
function moneySummary(S) {
  if (!S.rows.some(function (r) { return r.price || r.amount; })) return "";
  var sum = S.rows.reduce(function (t, r) { return t + (num(r.amount) || 0); }, 0);
  var tot = num(S.total), bad = S.rows.filter(function (r) { return rowCheck(r).ok === false; }).length;
  return "金额加总 " + r2(sum)
    + (isFinite(tot) ? (Math.abs(sum - tot) < 0.01 ? "，与单据总计 " + tot + " 一致" : "，单据总计写 " + tot + "，差 " + r2(tot - sum)) : "")
    + (bad ? "；有 " + bad + " 行数量×单价对不上" : "；每行数量×单价都对");
}

/* ---------- 单据草稿 ---------- */
function newDraft(files) {
  var d = { n: seq++, pages: [], status: "new", msg: "", img: [] };
  DRAFTS.unshift(d); draw();
  addFiles(d, files).then(function () { draw(); runDraft(DRAFTS.indexOf(d)); });
}
function addFiles(d, files) {
  return files.reduce(function (p, f) {
    return p.then(function () {
      return readImg(f).then(function (img) {
        d.img.push(img);
        d.pages.push({ thumb: cut(img, 0, 0, img.naturalWidth, img.naturalHeight, 280, 0.6) });
      });
    });
  }, Promise.resolve());
}
function addPage(i, input) {
  var d = DRAFTS[i], f = input.files[0]; input.value = "";
  if (!f) return;
  addFiles(d, [f]).then(function () { d.status = "new"; d.msg = "已加一页，请重新识别"; draw(); });
}
function delDraft(i) { DRAFTS.splice(i, 1); draw(); }
function openDraft(i) { S = DRAFTS[i].result; S.draft = i; table(); }

function runDraft(i) {
  var d = DRAFTS[i], st = provState(), u = provUsable(st);
  if (!u.length) { TAB = "set"; draw(); return; }
  d.status = "run"; d.msg = ""; draw();
  var errs = [], t0 = Date.now();
  var tick = setInterval(function () {
    var el = document.querySelector(".card .spin"); if (el && el.parentNode) el.parentNode.childNodes[1].nodeValue = " 识别中… " + Math.round((Date.now() - t0) / 1000) + " 秒";
  }, 1000);
  var step = function (k) {
    if (k >= u.length) return Promise.reject(new Error("所有模型都失败了"));
    var p = u[k];
    d.msg = "正在用：" + p.name; draw();
    return recognizeDraft(d, p, st.keys[p.id])
      .then(function (r) { r.by = p.name; return r; })
      .catch(function (e) { errs.push(p.name + "：" + (e.message || e)); return step(k + 1); });
  };
  step(0).then(function (r) {
    clearInterval(tick);
    d.result = r; d.result.rows.forEach(function (row) {
      row.cands = candidates(row); var b = row.cands[0];
      row.chosen = (b && b.s >= 0.45) ? b.name : "__hand";
    });
    d.status = "ok"; d.msg = "由 " + r.by + " 识别，用时 " + Math.round((Date.now() - t0) / 1000) + " 秒"; draw();
  }).catch(function (e) {

}
function recognizeDraft(d, p, key) {

    var all = [], desc;
    d.img.forEach(function (img) { all.push(cut(img, 0, 0, img.naturalWidth, img.naturalHeight, 1800)); });
    if (d.img.length === 1) { var pk = packImages(d.img[0], p.maxImg); all = pk.imgs; desc = pk.desc; }
    else desc = "这张单据有 " + d.img.length + " 页，按顺序给你，请从第一页开始连续编号。";
    var content = all.map(function (b) { return { type: "image_url", image_url: { url: p.raw ? b : "data:image/jpeg;base64," + b } }; });
    content.push({ type: "text", text: buildPrompt(desc, p.items !== false) });
    return callAI(p, key, content, /thinking/.test(p.model) ? 180000 : 90000).then(parseReply);
  }
  return d.img.reduce(function (chain, img, idx) {
    return chain.then(function (acc) {
      var b = cut(img, 0, 0, img.naturalWidth, img.naturalHeight, 1800);
      var content = [{ type: "image_url", image_url: { url: p.raw ? b : "data:image/jpeg;base64," + b } },
        { type: "text", text: buildPrompt("这是单据的第 " + (idx + 1) + " 页。", p.items !== false) }];
      return callAI(p, key, content, /thinking/.test(p.model) ? 180000 : 90000).then(function (t) {
        var r = parseReply(t);
        r.rows.forEach(function (x) { x.no = acc.rows.length + 1; acc.rows.push(x); });
        ["date", "supplier", "type", "total"].forEach(function (k) { if (!acc[k] && r[k]) acc[k] = r[k]; });
        return acc;
      });
    });

}

/* ---------- 对照表 ---------- */
function table() {

  var h = '<h1>核对单据 <span>' + S.rows.length + ' 行</span></h1>'
    + '<p class="sub">' + esc([S.type, S.supplier, S.date && "日期 " + S.date].filter(Boolean).join(" · "))

        + ' · ' + (x.src === "记忆" || x.src === "答案" ? x.src : Math.round(x.s * 100) + "%") + '</option>'; }).join("")
      + '<option value="__hand"' + (pre === "__hand" ? " selected" : "") + '>保留「' + esc(r.hand) + '」</option>'

  render(h, [{ t: "返回", fn: function () { S = null; go("in"); } }, { t: "按答案对照", fn: applyAnswers }, { t: "确认", cls: "red", fn: confirmStep }]);

function parseAnswers(s) {

    while ((m = re.exec(s))) out.push({ no: +m[1], name: m[2].replace(/\s+/g, "") });
    return out.filter(function (a) { return a.name; }); }
  return s.split(/[\n,，。;；、]+/).map(function (x) { return x.replace(/\s+/g, ""); }).filter(Boolean)
    .map(function (name, i) { return { no: i + 1, name: name }; });
}
function applyAnswers() {
  var ans = parseAnswers(document.getElementById("ans").value);

  var byNo = S.rows.every(function (x) { return x.no != null; });
  ans.forEach(function (a, i) {
    var row = byNo ? S.rows.filter(function (x) { return x.no === a.no; })[0] : S.rows[i];
    if (!row) { row = { no: a.no, hand: "", unit: "", qty: "" }; S.rows.push(row); }
    row.answer = a.name;
  });
  S.rows.sort(function (a, b) { return a.no - b.no; });
  S.rows.forEach(function (r) { r.cands = candidates(r); if (r.answer) r.chosen = r.cands[0] ? r.cands[0].name : "__hand"; });
  S.answered = ans.length;

  toast(ans.length !== n ? "注意：识别出 " + n + " 行，答案有 " + ans.length + " 行，可能错位，请逐行核对" : "已按答案对照 " + ans.length + " 行");
}

/* ---------- 学习确认 ---------- */
function confirmStep() {
  var tag = [S.supplier, S.date].filter(Boolean).join(" ");
  var pairs = [];
  S.rows.forEach(function (r) {
    var c = r.chosen && r.chosen !== "__hand" ? r.chosen : "";
    if (!c || !r.hand || norm(c) === norm(r.hand)) return;
    if (MEM.some(function (m) { return m.wrong === r.hand && m.right === c; })) return;
    pairs.push({ wrong: r.hand, right: c, ctx: (tag ? tag + " " : "") + "第" + r.no + "行" });
  });
  if (!pairs.length) { save([]); return; }
  var n = S.rows.filter(function (x) { return x.hand; }).length;
  var warn = S.answered && S.answered !== n ? "识别出 " + n + " 行，答案有 " + S.answered + " 行，可能错位了。已全部取消勾选，请逐条核对后再勾。" : "";
  render('<h1>是否学习？</h1><p class="sub">只有勾选的会记住，下次遇到同样的字就自动对上。单据照样保存。</p>'
    + (warn ? '<p class="err">' + esc(warn) + '</p>' : '')
    + pairs.map(function (p, i) { return '<label class="card ck"><input type="checkbox" id="p' + i + '"' + (warn ? '' : ' checked') + '>'
      + '<div><div><s class="old">' + esc(p.wrong) + '</s> → <b class="new">' + esc(p.right) + '</b></div>'
      + '<div class="meta">' + esc(p.ctx) + '</div></div></label>'; }).join(""),
    [{ t: "都不学习", fn: function () { save([]); } },
     { t: "学习勾选的", cls: "red", fn: function () {
        save(pairs.filter(function (_, i) { return document.getElementById("p" + i).checked; })); } }]);
}
function save(learned) {
  learned.forEach(function (p) {
    var ex = MEM.filter(function (m) { return m.wrong === p.wrong && m.right === p.right; })[0];
    if (ex) { ex.count++; ex.at = Date.now(); } else MEM.push({ wrong: p.wrong, right: p.right, ctx: p.ctx, count: 1, at: Date.now() });
  });
  if (learned.length) lset(LS.mem, MEM);
  var out = S.rows.map(function (r) {
    var name = r.chosen && r.chosen !== "__hand" ? r.chosen : "";
    var it = name ? ITEMS.filter(function (v) { return v.name === name; })[0] : null;
    return { no: r.no, item: name, hand: r.hand, unit: r.unit || (it ? it.unit : ""), qty: r.qty, actual: r.actual,
      price: r.price, amount: r.amount, check: rowCheck(r).txt, code: it ? it.code : "", cat: it ? it.cat : "" };
  });
  var rec = { type: S.type, supplier: S.supplier, date: S.date, total: S.total, by: S.by, at: Date.now(), rows: out,
    money: moneySummary(S), un: out.filter(function (r) { return !r.item; }).length };
  var pend = lget(LS.pending, []); pend.unshift(rec); lset(LS.pending, pend.slice(0, 100));
  if (S.draft != null && DRAFTS[S.draft]) DRAFTS.splice(S.draft, 1);
  S = null; TAB = "pend"; draw();
  toast("已存入待上传，学习了 " + learned.length + " 条");
}

/* ---------- 待上传 / 已上传 ---------- */
function pageList(which) {
  var key = which === "pend" ? LS.pending : LS.done, L = lget(key, []);
  var h = head(which === "pend" ? "核对好的单据先放这里，录进二维火后点「标记已上传」。" : "已经录进二维火的单据，保留最近 100 张。")
    + (L.length ? L.map(function (r, i) {
      return '<div class="card"><div class="top"><span class="rn">'
        + esc([r.type || "单据", r.supplier, r.date].filter(Boolean).join(" · ")) + '</span>'
        + (r.un ? '<span class="tag t-no">' + r.un + ' 行未对应</span>' : '<span class="tag t-ok">全部对应</span>') + '</div>'
        + '<div class="meta">' + r.rows.length + ' 行 · ' + fmtTime(r.at) + (r.money ? ' · ' + esc(r.money) : '') + '</div>'
        + '<div class="row" style="margin-top:8px"><button class="ghost" onclick="copyRec(\'' + which + '\',' + i + ')">复制表格</button>'
        + '<button class="ghost" onclick="viewRec(\'' + which + '\',' + i + ')">查看</button>'
        + (which === "pend" ? '<button class="red" onclick="markDone(' + i + ')">标记已上传</button>'
           : '<button class="ghost" onclick="backPend(' + i + ')">退回待上传</button>')
        + '<button class="ghost" onclick="delRec(\'' + which + '\',' + i + ')">删除</button></div></div>';
    }).join("") : '<p class="dim">还没有单据。</p>')
    + '<p class="dim" id="toast"></p>';
  render(h, []);
}
function recOf(which, i) { return lget(which === "pend" ? LS.pending : LS.done, [])[i]; }
function copyRec(which, i) { var r = recOf(which, i); if (r) copy(tsvOf(r)); }
function viewRec(which, i) {
  var r = recOf(which, i); if (!r) return;
  render('<h1>' + esc([r.type || "单据", r.supplier, r.date].filter(Boolean).join(" · ")) + '</h1>'
    + '<p class="sub">' + r.rows.length + ' 行 · ' + fmtTime(r.at) + (r.by ? ' · ' + esc(r.by) : '') + (r.money ? '<br><b>' + esc(r.money) + '</b>' : '') + '</p>'
    + '<pre>' + esc(tsvOf(r)) + '</pre><p class="dim" id="toast"></p>',
    [{ t: "返回", fn: function () { go(which); } }, { t: "复制表格", cls: "red", fn: function () { copy(tsvOf(r)); } }]);
}
function markDone(i) {
  var p = lget(LS.pending, []), r = p.splice(i, 1)[0];
  if (!r) return;
  r.uploadedAt = Date.now();
  var d = lget(LS.done, []); d.unshift(r);
  lset(LS.pending, p); lset(LS.done, d.slice(0, 100)); draw();
}
function backPend(i) {
  var d = lget(LS.done, []), r = d.splice(i, 1)[0];
  if (!r) return;
  var p = lget(LS.pending, []); p.unshift(r);
  lset(LS.done, d); lset(LS.pending, p); draw();
}
function delRec(which, i) {
  var key = which === "pend" ? LS.pending : LS.done, L = lget(key, []);
  L.splice(i, 1); lset(key, L); draw();
}
function tsvOf(rec) {
  var h = [];
  if (rec.supplier) h.push("供应商\t" + rec.supplier);
  if (rec.date) h.push("日期\t" + rec.date);
  var t = h.concat(["序号\t二维火品名\t单据品名\t单位\t申请数量\t实到数量\t单价\t金额\t核对\t条形码"])
    .concat(rec.rows.map(function (r) {
      return [r.no, r.item || "（未对应）", r.hand, r.unit, r.qty, r.actual, r.price, r.amount, r.check, r.code].join("\t"); })).join("\n");
  return t + (rec.total ? "\n\t\t单据总计\t\t\t\t\t" + rec.total : "");
}
function copy(t) {
  function fallback() {
    var a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); toast("已复制"); } catch (e) { toast("复制失败，请长按文字手动复制"); }
    document.body.removeChild(a);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast("已复制，可粘贴到表格"); }, fallback);
  else fallback();
}

/* ---------- 设置 ---------- */
var SETTAB = "ai";
function pageSet() {
  var sub = [["ai", "AI 模型"], ["lib", "品名库"], ["mem", "纠正记忆"]];
  var h = head("") + '<div class="chips">' + sub.map(function (x) {
    return '<button class="mchip' + (SETTAB === x[0] ? " on" : "") + '" onclick="setTab(\'' + x[0] + '\')">' + x[1] + '</button>'; }).join("") + '</div>';
  if (SETTAB === "ai") h += setAI();
  else if (SETTAB === "lib") h += setLib(window.__q || "");
  else h += setMem();
  h += '<p class="dim" id="toast"></p>';
  render(h, SETTAB === "ai" ? [{ t: "保存", cls: "red", fn: function () { grabKeys(); toast("已保存"); } }]
    : SETTAB === "lib" ? [{ t: "导入品名", cls: "red", fn: importItems }] : []);
  if (SETTAB === "lib") {
    var qi = document.getElementById("q");
    if (qi) qi.oninput = function () { window.__q = qi.value; clearTimeout(window.__qt); window.__qt = setTimeout(pageSet, 300); };
  }
}
function setTab(t) { SETTAB = t; draw(); }
function setAI() {
  var st = provState();
  return '<p class="dim">从上到下依次尝试，一家失败自动换下一家。<br>绿色「网页可用」的才能在网页里调用；<b class="err">智谱和豆包不允许网页直接调用</b>（实测被浏览器拦截），只能在 Scriptable 里用。</p>'
    + st.list.map(function (p, i) {
      var ok = p.on !== false && st.keys[p.id] && p.model;
      return '<div class="card"><div class="top"><span class="rn">' + (ok ? "✅" : p.on === false ? "⛔️" : "⚪️") + " " + (i + 1) + ". " + esc(p.name) + '</span>'
        + '<span class="tag ' + (p.cors === "网页可用" ? "t-ok" : p.cors === "网页不可用" ? "t-no" : "t-maybe") + '">' + esc(p.cors) + '</span></div>'
        + '<div class="meta">申请：' + esc(p.site) + '</div>'
        + '<div class="row" style="margin-top:7px"><input type="password" id="k_' + p.id + '" placeholder="API Key" value="' + esc(st.keys[p.id] || "") + '"></div>'
        + '<div class="row" style="margin-top:6px"><input type="text" id="m_' + p.id + '" placeholder="模型 ID" value="' + esc(p.model || "") + '" style="flex:2">'
        + '<button class="ghost" onclick="toggleProv(\'' + p.id + '\')">' + (p.on === false ? "启用" : "停用") + '</button>'
        + '<button class="ghost" onclick="testOne(\'' + p.id + '\')">测试</button></div>'
        + '<p class="dim" id="t_' + p.id + '"></p></div>';
    }).join("");
}
function grabKeys() {
  var s = provState();
  s.list.forEach(function (p) {
    var k = document.getElementById("k_" + p.id), m = document.getElementById("m_" + p.id);
    if (k) s.keys[p.id] = k.value.trim();
    if (m) p.model = m.value.trim();
  });
  provSave(s);
}
function toggleProv(id) {
  grabKeys(); var s = provState();
  s.list.forEach(function (p) { if (p.id === id) p.on = (p.on === false); });
  provSave(s); draw();
}
function testOne(id) {
  grabKeys();
  var s = provState(), p = s.list.filter(function (x) { return x.id === id; })[0], out = document.getElementById("t_" + id);
  if (!s.keys[id]) { out.innerHTML = '<span class="err">还没填 Key</span>'; return; }
  if (!p.model) { out.innerHTML = '<span class="err">还没填模型 ID</span>'; return; }
  out.innerHTML = '<span class="spin"></span> 测试中…';
  var c = document.createElement("canvas"); c.width = 360; c.height = 130;
  var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 360, 130);
  x.fillStyle = "#000"; x.font = "bold 38px sans-serif"; x.fillText("毛豆 2 件", 18, 52);
  x.font = "26px sans-serif"; x.fillText("单价 60 总价 120", 18, 104);
  var b = c.toDataURL("image/jpeg", 0.85).split(",")[1], t0 = Date.now();
  callAI(p, s.keys[id], [{ type: "image_url", image_url: { url: p.raw ? b : "data:image/jpeg;base64," + b } },
    { type: "text", text: "读出表格每一行，一行一条，用竖线分隔，不要其他文字：序号|品名|单位|申请数量|实到数量|单价|总价" }], 120000)
    .then(function (r) {
      var n = 0; try { n = parseReply(r).rows.length; } catch (e) {}
      out.innerHTML = '<span class="ok">✅ ' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒</span> '
        + (n ? '解析 ' + n + ' 行' : '<span class="err">解析失败</span>') + '<br>' + esc(String(r).replace(/\s+/g, " ").slice(0, 120));
    })
    .catch(function (e) { out.innerHTML = '<span class="err">❌ ' + esc(String(e.message || e).slice(0, 200)) + '</span>'; });
}
function setLib(q) {
  var list = q ? ITEMS.filter(function (v) { return v.name.indexOf(q) >= 0 || (v.cat || "").indexOf(q) >= 0; }) : ITEMS;
  return '<div class="row"><input type="text" id="q" placeholder="搜索品名或分类" value="' + esc(q) + '"></div>'
    + '<p class="dim">共 ' + ITEMS.length + ' 个' + (q ? '，找到 ' + list.length + ' 个' : '，显示前 200 个') + '</p>'
    + list.slice(0, 200).map(function (v) { return '<div class="card" style="padding:7px 11px"><div class="top"><span>' + esc(v.name) + '</span>'
      + '<span class="meta">' + esc([v.cat, v.unit].filter(Boolean).join(" · ")) + '</span></div></div>'; }).join("")
    + '<hr><p class="dim">从二维火导出的清单里复制整列，粘到这里追加</p>'
    + '<textarea id="imp" placeholder="每行一个品名；多栏会自动找「原料名称/品名、分类、单位、条形码」表头"></textarea>';
}
function importItems() {
  var el = document.getElementById("imp"); if (!el) return;
  var lines = el.value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
  if (!lines.length) { toast("没读到内容"); return; }
  var split = function (l) { return l.indexOf("\t") >= 0 ? l.split("\t") : l.split(/,|，/); };
  var hi = -1;
  lines.forEach(function (l, i) { if (hi < 0 && /品名|名称|原料/.test(l)) hi = i; });
  var add = [];
  if (hi >= 0) {
    var h = split(lines[hi]).map(function (s) { return s.trim(); });
    var f = function (re) { for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return -1; };
    var c = { n: f(/原料名称|品名|名称/), cat: f(/分类/), u: f(/主单位|单位/), code: f(/条形码|编码|编号/) };
    lines.slice(hi + 1).forEach(function (l) { var x = split(l).map(function (s) { return s.trim(); });
      if (x[c.n]) add.push({ name: x[c.n], cat: c.cat >= 0 ? x[c.cat] || "" : "", unit: c.u >= 0 ? x[c.u] || "" : "", code: c.code >= 0 ? x[c.code] || "" : "" }); });
  } else {
    lines.forEach(function (l) { var n = l.replace(/^\d+\s*[.、:：)）]?\s*/, "").trim(); if (n && !/^\d+$/.test(n)) add.push({ name: n, cat: "", unit: "", code: "" }); });
  }
  var have = {}; ITEMS.forEach(function (v) { have[v.name] = 1; });
  var n = 0; add.forEach(function (x) { if (x.name && !have[x.name]) { have[x.name] = 1; ITEMS.push(x); n++; } });
  if (n) lset(LS.items, ITEMS);
  draw(); toast("新增 " + n + " 个，共 " + ITEMS.length + " 个");
}
function setMem() {
  var m = MEM.slice().sort(function (a, b) { return (b.count - a.count) || (b.at - a.at); });
  return '<p class="dim">识别时交给 AI，也直接用于对应。共 ' + MEM.length + ' 条。</p>'
    + '<div class="card"><div class="row"><input type="text" id="mw" placeholder="认成" style="flex:1">'
    + '<input type="text" id="mr" placeholder="其实是" style="flex:1"><button class="ghost" onclick="addMem()">加一条</button></div></div>'
    + m.map(function (x) { return '<div class="card" style="padding:8px 11px"><div class="top"><span><s class="old">' + esc(x.wrong) + '</s> → <b class="new">' + esc(x.right) + '</b></span>'
      + '<button class="ghost" style="padding:2px 9px;font-size:13px" onclick="delMem(' + JSON.stringify(x.wrong + "\u0001" + x.right).replace(/"/g, "&quot;") + ')">删</button></div>'
      + '<div class="meta">' + esc(x.ctx || "") + ' · ×' + x.count + '</div></div>'; }).join("");
}
function addMem() {
  var w = document.getElementById("mw").value.trim(), r = document.getElementById("mr").value.trim();
  if (!w || !r) { toast("两栏都要填"); return; }
  MEM.push({ wrong: w, right: r, ctx: "手动", count: 1, at: Date.now() }); lset(LS.mem, MEM); draw();
}
function delMem(key) {
  var p = key.split("\u0001");
  MEM = MEM.filter(function (x) { return !(x.wrong === p[0] && x.right === p[1]); });
  lset(LS.mem, MEM); draw();
}

/* ---------- 启动 ---------- */
MEM = lget(LS.mem, null) || SEED_MEM.map(function (x) { return { wrong: x[0], right: x[1], ctx: x[2], count: 1, at: Date.now() }; });
ITEMS = lget(LS.items, null) || SEED_ITEMS.map(function (x) { return { name: x[0], cat: x[1], unit: x[2], code: x[3] }; });
if (!lget(LS.mem, null)) lset(LS.mem, MEM);
if (!lget(LS.items, null)) lset(LS.items, ITEMS);
draw();

</script>
</body>
</html>
