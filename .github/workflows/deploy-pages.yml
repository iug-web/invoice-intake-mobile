name: Deploy mobile receipt tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble static site from pinned releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/vendor/core _site/vendor/lang
          cp index.html ocr.js .nojekyll _site/
          cp vendor/tesseract.min.js vendor/worker.min.js vendor/xlsx.full.min.js vendor/APACHE-2.0.txt _site/vendor/
          curl --fail --location --retry 3 --max-time 180 https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core-lstm.wasm.js -o _site/vendor/core/tesseract-core-lstm.wasm.js
          curl --fail --location --retry 3 --max-time 180 https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/tesseract-core-lstm.wasm -o _site/vendor/core/tesseract-core-lstm.wasm
          curl --fail --location --retry 3 --max-time 180 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/chi_sim.traineddata -o _site/vendor/lang/chi_sim.traineddata
          curl --fail --location --retry 3 --max-time 180 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata -o _site/vendor/lang/eng.traineddata
          sha256sum --check <<'CHECKSUMS'
          a8e29918d098b2b06e1012bdaeffb4aec0445c5d5654709023e0bd1f442a80e8  _site/vendor/tesseract.min.js
          aca1229639fc9907d86f96e825955a2b7c5716d17f3bc3acd71f9c7ab66181fc  _site/vendor/worker.min.js
          cc015130aa8521e7f088f88898eba949ccdcbfb38df0bd129b44b7273c3a6f41  _site/vendor/xlsx.full.min.js
          CHECKSUMS
          gzip -n _site/vendor/lang/chi_sim.traineddata _site/vendor/lang/eng.traineddata
          curl --fail --location --retry 3 --max-time 60 https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js.LICENSE.txt -o _site/vendor/tesseract.min.js.LICENSE.txt
          curl --fail --location --retry 3 --max-time 60 https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js.LICENSE.txt -o _site/vendor/worker.min.js.LICENSE.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
