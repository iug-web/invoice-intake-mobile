<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="算热量">
<meta name="theme-color" content="#15803d">
<title>拍照算热量</title>
<style>
  :root{--g:#15803d;--g2:#dcfce7;--g3:#f0fdf4;--bg:#f4f6f5;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--red:#dc2626;--amb:#b45309;--amb2:#fef3c7;
        --p:#2563eb;--f:#d97706;--c:#7c3aed}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding-top:env(safe-area-inset-top);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px;font-size:15px}
  header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline}
  header h1{font-size:20px;margin:0}
  .card{background:var(--card);border-radius:14px;margin:10px 12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  h3{margin:0 0 10px;font-size:16px}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:var(--g);color:#fff;font-family:inherit}
  .btn.sec{background:var(--g2);color:var(--g)}
  .btn.ghost{background:#f3f4f6;color:var(--tx);font-weight:500}
  .btn.sm{padding:8px 12px;font-size:14px;width:auto;display:inline-block}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px;align-items:center}
  .row>.grow{flex:1}
  .mu{color:var(--mu);font-size:13px}
  .err{color:var(--red);font-size:14px}
  input,select,textarea{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:#fff;width:100%;color:var(--tx)}
  textarea{resize:vertical;min-height:44px}
  label.l{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;font-family:inherit;color:var(--tx)}
  .chip.on{background:var(--g);border-color:var(--g);color:#fff}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs div{position:relative}
  .thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
  .thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:#111;color:#fff;font-size:13px;line-height:22px;padding:0}
  .add{width:84px;height:84px;border:2px dashed var(--bd);border-radius:10px;background:#fafafa;font-size:26px;color:var(--mu)}
  .stats{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;text-align:center}
  .stats div{background:var(--bg);border-radius:10px;padding:8px 2px}
  .stats b{display:block;font-size:18px}
  .stats span{font-size:11px;color:var(--mu)}
  .stats .k b{color:var(--g);font-size:20px}
  .range{font-size:12px;color:var(--mu);text-align:center;margin-top:6px}
  .item{border-top:1px solid var(--bd);padding:10px 0}
  .item:first-of-type{border-top:none}
  .item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .item .n{font-weight:600}
  .item .s{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.5}
  .item .w{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .item .w input{width:68px;padding:5px;text-align:right}
  .item .x{border:none;background:none;color:var(--mu);font-size:18px;padding:0 0 0 6px}
  .tag{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:500;white-space:nowrap}
  .t-高{background:var(--g2);color:var(--g)} .t-中{background:var(--amb2);color:var(--amb)} .t-低{background:#fee2e2;color:var(--red)}
  .t-src{background:#e0e7ff;color:#3730a3}
  .t-hid{background:#f3e8ff;color:#6b21a8}
  .note{background:var(--g3);border-left:4px solid var(--g);padding:9px 10px;border-radius:8px;font-size:14px;margin-top:8px;line-height:1.55}
  .note.q{background:#fffbeb;border-color:#f59e0b}
  .tip{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.5}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;padding:9px 0 12px;font-size:12px;color:var(--mu);font-family:inherit}
  nav button b{display:block;font-size:20px;font-weight:400}
  nav button.on{color:var(--g);font-weight:600}
  .page{display:none}.page.on{display:block}
  .bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px}
  .mac{display:grid;grid-template-columns:52px 1fr 92px;gap:8px;align-items:center;font-size:13px;margin-top:8px}
  .mac span:last-child{text-align:right;color:var(--mu)}
  .daynav{display:flex;justify-content:space-between;align-items:center}
  .daynav button{border:none;background:#f3f4f6;border-radius:8px;padding:6px 12px;font-size:16px}
  .meal{display:flex;gap:10px;align-items:center;border-top:1px solid var(--bd);padding:10px 0}
  .meal:first-child{border-top:none}
  .meal img{width:54px;height:54px;border-radius:9px;object-fit:cover;flex:none}
  .meal .ph{width:54px;height:54px;border-radius:9px;background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .meal .del{border:none;background:none;color:var(--mu);font-size:13px;padding:4px}
  .meal .del.arm{color:var(--red);font-weight:600}
  .week{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:6px;position:relative}
  .week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .week .col i{display:block;width:70%;background:var(--g);border-radius:4px 4px 0 0;min-height:2px}
  .week .col i.over{background:#f59e0b}
  .week .col span{font-size:11px;color:var(--mu);margin-top:4px}
  .week .col em{font-size:10px;color:var(--mu);font-style:normal}
  .goal-line{position:absolute;left:0;right:0;border-top:1px dashed var(--red);pointer-events:none}
  .hidden{display:none!important}
  .seg{display:flex;background:#f3f4f6;border-radius:10px;padding:3px}
  .seg button{flex:1;border:none;background:none;padding:7px;border-radius:8px;font-size:14px;font-family:inherit;color:var(--tx)}
  .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
  .ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 16px 30px}
  .ov h2{text-align:center;margin:10px 0 20px}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pgrid button{border:none;background:#fff;border-radius:16px;padding:16px 4px;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--tx)}
  .pgrid button b{display:block;font-size:40px;margin-bottom:6px}
  .pgrid button span{font-size:12px;color:var(--mu)}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:16px auto}
  .pinpad button{border:none;background:#fff;border-radius:14px;padding:16px;font-size:22px;font-family:inherit}
  .pindots{text-align:center;font-size:28px;letter-spacing:10px;height:36px}
  .who{border:none;background:#fff;border-radius:18px;padding:4px 10px 4px 6px;font-size:14px;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--tx)}
  .avs{display:flex;gap:6px;flex-wrap:wrap}
  .avs button{font-size:24px;border:2px solid transparent;background:#f3f4f6;border-radius:12px;width:44px;height:44px;padding:0}
  .avs button.on{border-color:var(--g);background:var(--g2)}
  .modes{display:grid;gap:8px}
  .modes button{text-align:left;border:2px solid var(--bd);background:#fff;border-radius:12px;padding:10px 12px;font-family:inherit;color:var(--tx)}
  .modes button.on{border-color:var(--g);background:var(--g3)}
  .modes button b{font-size:15px}.modes button div{font-size:12px;color:var(--mu);margin-top:2px}
  .rw{display:flex;justify-content:space-around;text-align:center;margin:4px 0 10px}
  .rw b{display:block;font-size:22px}.rw span{font-size:12px;color:var(--mu)}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .badges span{font-size:26px;filter:grayscale(1);opacity:.35}
  .badges span.got{filter:none;opacity:1}
  .task{display:flex;align-items:center;gap:10px;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff;width:100%;font-family:inherit;font-size:15px;color:var(--tx);text-align:left}
  .task.on{border-color:#f59e0b;background:#fffbeb}
  .task .ic{font-size:24px}.task .st{margin-left:auto;font-size:22px}
  #cele{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none;align-items:center;justify-content:center;overflow:hidden}
  #cele.on{display:flex}
  #cele .box{background:#fff;border-radius:22px;padding:26px 22px;width:84%;max-width:340px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  #cele .big{font-size:72px;line-height:1}
  #cele h2{margin:10px 0 6px}
  #cele p{color:var(--mu);line-height:1.6;margin:0 0 16px;white-space:pre-line}
  #cele .cf{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards;pointer-events:none}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .modeTag{font-size:12px;background:var(--g2);color:var(--g);border-radius:8px;padding:2px 8px;margin-left:6px;font-weight:500}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:.9}
</style>
</head>
<body>
<header><h1>🍱 拍照算热量</h1><button class="who" id="whoBtn"></button><span id="syncState" class="hidden"></span></header>
<div style="padding:0 12px"><div class="chips" id="aiBar" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;white-space:nowrap"></div></div>

<!-- ================= 识别 ================= -->
<section class="page on" id="p-scan">
  <div class="card" id="unavail" style="display:none"><div class="err" id="unavailTxt"></div></div>

  <div class="card" id="inputCard">
    <h3>1. 拍照</h3>
    <div class="mu">可加多张：菜品整体 + 包装标签/营养成分表，结果更准</div>
    <div class="row" style="margin-top:10px">
      <button class="btn grow" id="camBtn">📷 拍照</button>
      <button class="btn sec grow" id="albBtn">🖼️ 相册</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <input type="file" id="file" accept="image/*" multiple hidden>

    <label class="l">2. 这是哪一餐</label>
    <div class="chips" id="mealType"></div>

    <label class="l">3. 实际吃了多少</label>
    <div class="chips" id="portion"></div>

    <label class="l">4. 补充说明（可选）</label>
    <textarea id="hint" rows="2" placeholder="例：做成寿喜烧，加了2个生鸡蛋；米饭是糙米；少油"></textarea>

    <button class="btn" id="goBtn" style="margin-top:12px" disabled>开始分析</button>
    <div id="status" class="mu" style="margin-top:8px"></div>
  </div>

  <div id="result"></div>
</section>

<!-- ================= 今日 ================= -->
<section class="page" id="p-day">
  <div class="card">
    <div class="daynav"><button id="prevDay">‹</button><b id="dayLabel"></b><button id="nextDay">›</button></div>
    <div style="margin-top:12px" id="dayStats"></div>
    <div id="dayMacros"></div>
    <div class="tip" id="dayLeft"></div>
  </div>
  <div class="card" id="rewardCard"></div>
  <div class="card hidden" id="kidCard"></div>
  <div class="card hidden" id="weightCard"></div>
  <div class="card"><h3>记录</h3><div id="meals"></div>
    <button class="btn ghost" style="margin-top:10px" id="manualBtn">＋ 不拍照，手动记一餐</button>
  </div>
  <div class="card" id="weekCard"><h3>近 7 天热量</h3><div class="week" id="week"></div><div class="mu" style="margin-top:6px">红色虚线 = 每日目标</div></div>
</section>

<!-- ================= 菜单 ================= -->
<section class="page" id="p-plan">
  <div class="card">
    <h3>买菜清单 → 分配餐食</h3>
    <div class="mu">拍购物小票或食材，或直接输入清单</div>
    <div class="row" style="margin-top:10px">
      <button class="btn grow" id="pCamBtn">📷 拍小票</button>
      <button class="btn sec grow" id="pAlbBtn">🖼️ 相册</button>
    </div>
    <div class="thumbs" id="pThumbs"></div>
    <input type="file" id="pCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="pFile" accept="image/*" multiple hidden>
    <label class="l">或输入清单</label>
    <textarea id="pList" rows="3" placeholder="例：黑毛和牛肩肉 321g、白菜半颗、豆腐2盒、鸡蛋10个、三文鱼2块、西兰花1颗"></textarea>
    <label class="l">几个人吃</label><div class="chips" id="pPeople"></div>
    <label class="l">每天几餐</label><div class="chips" id="pMeals"></div>
    <label class="l">安排几天</label><div class="chips" id="pDays"></div>
    <label class="l">家里已有 / 口味偏好（可选）</label>
    <textarea id="pPref" rows="2" placeholder="例：家里有米、调料齐全；孩子不吃辣；想少油"></textarea>
    <button class="btn" style="margin-top:12px" id="planGo">生成菜单</button>
    <div id="pStatus" class="mu" style="margin-top:8px"></div>
  </div>
  <div id="planOut"></div>
</section>

<!-- ================= 设置 ================= -->
<section class="page" id="p-set">
  <div class="card" id="profCard"></div>
  <div class="card">
    <h3>每日目标 <button class="btn sec sm" id="autoTgt" style="float:right;padding:4px 10px;font-size:13px">按资料自动计算</button></h3>
    <label class="l">热量（kcal）</label><input type="number" id="sKcal" inputmode="numeric">
    <div class="row" style="margin-top:4px">
      <div class="grow"><label class="l">蛋白质 %</label><input type="number" id="sP" inputmode="numeric"></div>
      <div class="grow"><label class="l">脂肪 %</label><input type="number" id="sF" inputmode="numeric"></div>
      <div class="grow"><label class="l">碳水 %</label><input type="number" id="sC" inputmode="numeric"></div>
    </div>
    <label class="l">钠上限（mg）</label><input type="number" id="sNa" inputmode="numeric">
    <div class="tip">一般成人参考：蛋白质 15–20%、脂肪 20–30%、碳水 50–60%，钠 2000 mg 以内。具体目标请结合自己情况。</div>
  </div>
  <div class="card">
    <h3>AI 模型</h3>
    <div class="mu">点选要用的 AI，每个填自己的 API Key（只保存在本机）。顶部也可一键切换。</div>
    <div class="chips" id="provChips" style="margin-top:10px"></div>
    <div id="provForm"></div>
  </div>
  <button class="btn" style="margin:4px 12px;width:calc(100% - 24px)" id="saveSet">保存设置</button>
  <div class="card mu" style="line-height:1.6">
    <h3 style="color:var(--tx)">数据备份</h3>
    记录只保存在这台手机的浏览器里。换手机或清除 Safari 数据前，请先导出备份。
    <div class="row" style="margin-top:10px">
      <button class="btn sec grow" id="expBtn">导出备份</button>
      <button class="btn ghost grow" id="impBtn">导入备份</button>
    </div>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
  </div>
</section>

<nav>
  <button class="on" data-p="scan"><b>📷</b>识别</button>
  <button data-p="day"><b>📊</b>记录</button>
  <button data-p="plan"><b>📝</b>菜单</button>
  <button data-p="set"><b>⚙️</b>设置</button>
</nav>
<div class="toast" id="toast"></div>
<div class="ov hidden" id="login"></div>
<div id="cele"><div class="box"><div class="big" id="ceBig"></div><h2 id="ceT"></h2><p id="ceM"></p><button class="btn" id="ceOk">太棒了！</button></div></div>

<script>
/* =========================================================
   基础
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round((+n || 0) * 10) / 10;
const r0 = n => Math.round(+n || 0);
const pad = n => String(n).padStart(2, '0');
const dateKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1800); }

const MEALS = ['早餐','午餐','晚餐','加餐'];
const PORTIONS = [['全部',1],['3/4',.75],['一半',.5],['1/3',1/3],['1/4',.25],['自定',0]];
const DEFAULT_SET = {kcal:1800,p:20,f:30,c:50,na:2000,tier:'default'};

let sample = null, db = null, uid = null;
let settings = {...DEFAULT_SET};
let photos = [];            // [{blob, url}]
let mealType = guessMeal(), portion = 1;
let current = null;         // 当前分析结果
let viewDate = new Date();
const dayCache = {};        // dateKey -> {meals:[]}

function guessMeal(){ const h=new Date().getHours(); return h<10?'早餐':h<15?'午餐':h<21?'晚餐':'加餐'; }

/* =========================================================
   存储：优先账号数据库（跨设备），否则本机
   ========================================================= */
const GLOBAL_KEYS = ['ai','profiles','cur'];
let curPid = null;
const pk = k => GLOBAL_KEYS.includes(k) || !curPid ? 'fa_' + k : 'fa_' + curPid + '_' + k;
const local = {
  get(k){ try{ return JSON.parse(localStorage.getItem(pk(k))); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(pk(k), JSON.stringify(v)); }catch(e){ toast('手机存储空间不足，请导出备份后删除旧记录'); } }
};
async function loadDoc(name){
  if (db && uid){
    try{ const s = await db.doc('data/users/'+uid+'/'+name).get(); return s.exists ? s.data() : null; }
    catch(e){ return local.get(name); }
  }
  return local.get(name);
}
async function saveDoc(name, data){
  local.set(name, data);
  if (db && uid){
    try{ await db.doc('data/users/'+uid+'/'+name).set(data); return true; }
    catch(e){ if (e && e.code==='quota_exceeded') toast('存储空间已满，请删除一些旧记录'); return false; }
  }
  return true;
}
async function getDay(k){
  if (!dayCache[k]){ const d = await loadDoc('day_'+k); dayCache[k] = (d && Array.isArray(d.meals)) ? {meals:[...d.meals]} : {meals:[]}; }
  return dayCache[k];
}
async function putDay(k){ return saveDoc('day_'+k, {meals: dayCache[k].meals}); }

/* =========================================================
   初始化
   ========================================================= */
renderChips(); renderThumbs(); bindNav();

(async () => {
  await null;
  ai = {...ai, ...(local.get('ai') || {})};
  for (const k in PROVIDERS) ai.cfg[k] = {key:'', model:PROVIDERS[k].model, url:PROVIDERS[k].url || '', ...(ai.cfg[k] || {})};
  sample = { json: callAIJson };
  renderAIBar(); renderProvForm();
  initProfiles();
  updateGo();
})();

function bindNav(){
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x===b));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id==='p-'+b.dataset.p));
    if (b.dataset.p==='day') renderDay();
    if (b.dataset.p==='plan') loadPlan();
    window.scrollTo(0,0);
  });
}

/* =========================================================

const onPick = async e => {

function loadImg(src){ return new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=src; }); }
async function shrink(file, max, q){
  const url = URL.createObjectURL(file);
  try{
    const im = await loadImg(url);
    const k = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
async function thumbOf(blob){
  const url = URL.createObjectURL(blob);
  try{
    const im = await loadImg(url); const s=120, c=document.createElement('canvas'); c.width=c.height=s;
    const m=Math.min(im.naturalWidth,im.naturalHeight);
    c.getContext('2d').drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,s,s);
    return c.toDataURL('image/jpeg',.7);
  } finally { URL.revokeObjectURL(url); }
}

const SCHEMA = `{
  "is_food": true,
  "meal_name": "一句话概括这餐，如：黑毛和牛寿喜烧（生肉）",
  "items": [
    {
      "name": "具体食物名（中文简体），注明生/熟和做法",
      "weight_g": 数字，本次照片中的全部重量,
      "weight_source": "标签" | "估算",
      "per100g": {"kcal":数字,"protein":数字,"fat":数字,"carbs":数字,"fiber":数字,"sodium_mg":数字},
      "data_source": "所用成分表，如：日本食品标准成分表 / 中国食物成分表 / 包装营养标签",
      "confidence": "高" | "中" | "低",
      "hidden": false
    }
  ],
  "kcal_range": [下限, 上限],
  "notes": "关键判断依据，1-2句（如：标签净重321g；按肩肉带脂计算）",
  "questions": ["如有会明显影响结果的不确定点，用一句话问用户；没有则空数组"],
  "advice": "针对这一餐的一句具体建议"
}`;

function buildPrompt(extra){
  return `你是注册营养师，擅长从照片估算食物营养。用户住在日本，常见日本超市商品与中式家常菜。${modeHint()}请分析附带的 ${photos.length} 张照片（可能是同一餐的不同角度或包装标签）。

【规则】
1. 逐项拆分：每种食物单独一项（米饭、各道菜、饮料分开）。
2. 重量优先级：包装上的净重/内容量（正味量、内容量、g）＞ 营养成分表上的份量 ＞ 根据餐具和堆叠高度目测。用了标签就把 weight_source 设为"标签"。多张照片是同一份食物时不要重复计算。
3. 营养数据优先级：包装上的营养成分表（栄養成分表示）＞ 日本食品标准成分表（日本商品、和牛等）＞ 中国食物成分表（中式菜）。per100g 必须是该食物在照片所示状态（生或熟）下每100g的值。
4. 隐藏热量：炒菜、油炸、拌酱的食物，把可估计的烹调油、酱汁、沙拉酱单独列为一项，并设 "hidden": true。生食材（如生肉、生菜）不要添加隐藏项，除非用户说明了做法。
5. 照片里是供多人份的整盒/整锅时，weight_g 仍填全部重量；用户实际吃的比例由程序另算，你不要自行折算。
6. 看不清或不确定的，confidence 设为"低"，并在 questions 里问一句关键问题（最多2个）。
7. 如果照片中没有可食用的食物，只返回 {"is_food": false, "reason": "原因"}。
${$('hint').value.trim() ? '\n【用户补充说明】\n' + $('hint').value.trim() + '\n（请按说明调整，例如做法、加了什么、哪些没吃。）' : ''}
${extra || ''}
【输出】只输出一个 JSON 对象，不要任何其他文字，结构如下：
${SCHEMA}`;
}

let ctl = null;
$('goBtn').onclick = () => runAnalysis();

async function runAnalysis(extra){
  if (!sample || !photos.length) return;
  ctl?.abort(); ctl = new AbortController();
  const btn = $('goBtn'); btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>分析中，约 10–40 秒…';
  $('status').innerHTML = `<button class="btn ghost sm" id="stopBtn">停止</button>`;
  $('stopBtn').onclick = () => ctl.abort();
  if (!extra) $('result').innerHTML = '';
  try{
    const data = await sample.json(buildPrompt(extra), {
      images: photos.map(p => p.blob), modelTier: settings.tier, signal: ctl.signal, cache: extra ? false : undefined
    });
    if (!data || data.is_food === false){
      $('result').innerHTML = `<div class="card err">没有识别到食物${data && data.reason ? '：' + esc(data.reason) : ''}。请拍清楚一点再试。</div>`;
      return;
    }
    current = normalize(data);
    current.portion = portion;
    renderResult();
    setTimeout(() => $('result').scrollIntoView({behavior:'smooth', block:'start'}), 50);
  } catch(e){
    if (e && e.code === 'cancelled'){ $('status').textContent = '已停止'; return; }
    $('result').innerHTML = `<div class="card err">${esc(errText(e))}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = current ? '重新分析' : '开始分析';
    if ($('stopBtn')) $('status').textContent = '';
  }
}
function errText(e){
  const c = e && e.code;
  return ({
    not_granted:'你没有允许这个页面使用 Claude，所以无法分析。刷新页面后可重新授权。',
    rate_limited:'请求太频繁或已达到使用额度，请稍后再试。',
    session_expired:'登录已过期，请重新登录 Claude。',
    image_rejected:'图片无法识别（格式或尺寸问题），请换一张。',
    images_unavailable:'当前环境无法发送图片，请更新 Claude App。',
    invalid_json:'AI 返回的格式有误，请再试一次，或换一个 AI。',
    no_key:'当前 AI 还没有填 API Key，请到「设置」填写，或在顶部换一个 AI。',
    refused:'AI 无法分析这张图片，请换一张食物照片。',
    sampling_disabled:'你的账号当前无法使用此功能。'
  })[c] || (e && e.message ? e.message : '分析失败，请稍后重试。');
}
function num(v){ v = +v; return isFinite(v) && v >= 0 ? v : 0; }
function normalize(d){
  const items = (Array.isArray(d.items) ? d.items : []).map(i => {
    const p = i.per100g || {};
    const w = num(i.weight_g) || 100;
    return { name: String(i.name || '未知食物'), w, w0: w, src: i.weight_source === '标签' ? '标签' : '估算',
      per: {kcal:num(p.kcal), p:num(p.protein), f:num(p.fat), c:num(p.carbs), fib:num(p.fiber), na:num(p.sodium_mg)},
      ds: String(i.data_source || ''), conf: ['高','中','低'].includes(i.confidence) ? i.confidence : '中', hidden: !!i.hidden, on: true };
  });
  const rg = Array.isArray(d.kcal_range) && d.kcal_range.length === 2 ? d.kcal_range.map(num) : null;
  return { name: String(d.meal_name || ''), items, range: rg, notes: String(d.notes || ''),
           questions: (Array.isArray(d.questions) ? d.questions : []).map(String).filter(Boolean).slice(0,2),
           advice: String(d.advice || '') };
}
function itemNut(i){ const k = i.w / 100; return {kcal:i.per.kcal*k, p:i.per.p*k, f:i.per.f*k, c:i.per.c*k, fib:i.per.fib*k, na:i.per.na*k}; }
function sumNut(items, ratio){
  const t = {kcal:0,p:0,f:0,c:0,fib:0,na:0};
  items.filter(i => i.on !== false).forEach(i => { const n = itemNut(i); for (const k in t) t[k] += n[k]; });
  for (const k in t) t[k] *= ratio; return t;
}
function statsHTML(t){
  return `<div class="stats"><div class="k"><b>${r0(t.kcal)}</b><span>热量 kcal</span></div>
    <div><b style="color:var(--p)">${r1(t.p)}</b><span>蛋白质 g</span></div>
    <div><b style="color:var(--f)">${r1(t.f)}</b><span>脂肪 g</span></div>
    <div><b style="color:var(--c)">${r1(t.c)}</b><span>碳水 g</span></div></div>`;
}

            <div class="s">${r0(n.kcal)} kcal · 蛋白 ${r1(n.p)} · 脂肪 ${r1(n.f)} · 碳水 ${r1(n.c)}<br>每100g ${r0(i.per.kcal)} kcal${i.ds?' · '+esc(i.ds):''}</div>
          </div>

        </div>
      </div>`; }).join('')}
    <div class="row" style="margin-top:10px">

  <div class="card">

    <button class="btn ghost" style="margin-top:8px" id="fixBtn">按纠正重新分析</button>
  </div>

  <div class="card">
    <div class="mu" style="margin-bottom:8px">记为「${mealType}」· 吃了 ${Math.round(ratio*100)}% · ${r0(t.kcal)} kcal</div>

  $('result').querySelectorAll('input[data-k]').forEach(inp => inp.onchange = () => {

  $('result').querySelectorAll('button[data-t]').forEach(b => b.onclick = () => {
    const it = c.items[+b.dataset.t]; it.on = !it.on; renderResult();

    runAnalysis(`\n【上一次分析结果】\n${prev}\n【用户纠正】\n${fix}\n请根据纠正重新给出完整结果。`);
  };
  $('saveMeal').onclick = saveCurrentMeal;
}

async function addMissingItem(){

async function lookupFood(text){
  const d = await sample.json(`你是注册营养师。用户描述了吃的东西：「${text}」。
按常见份量估算重量，用日本食品标准成分表或中国食物成分表给出每100g营养。可能包含多种食物，请拆开。
只输出 JSON：{"items":[{"name":"中文简体名","weight_g":数字,"per100g":{"kcal":数字,"protein":数字,"fat":数字,"carbs":数字,"fiber":数字,"sodium_mg":数字},"data_source":"来源","confidence":"高|中|低"}]}`,

function blobToB64(blob){
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
}
async function callAIText(prompt, blobs, signal, provKey){
  const k = provKey || ai.current, P = PROVIDERS[k], c = ai.cfg[k];
  if (!c || !c.key) throw {code:'no_key'};
  const model = c.model || P.model;
  if (!model) throw {code:'api', message: P.name + '：请先填写模型名称'};
  const imgs = await Promise.all((blobs || []).map(blobToB64));
  let url, headers = {'Content-Type':'application/json'}, body;
  if (P.type === 'anthropic'){
    url = 'https://api.anthropic.com/v1/messages';
    Object.assign(headers, {'x-api-key': c.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'});
    body = {model, max_tokens: 8000, messages:[{role:'user', content:[
      ...imgs.map(d => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data:d}})), {type:'text', text:prompt}]}]};
  } else if (P.type === 'gemini'){
    url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(c.key);
    body = {contents:[{role:'user', parts:[...imgs.map(d => ({inline_data:{mime_type:'image/jpeg', data:d}})), {text:prompt}]}]};
  } else {
    url = c.url || P.url; if (!url) throw {code:'api', message:'请先填写接口地址'};
    headers.Authorization = 'Bearer ' + c.key;
    body = {model, messages:[{role:'user', content: imgs.length
      ? [...imgs.map(d => ({type:'image_url', image_url:{url:'data:image/jpeg;base64,' + d}})), {type:'text', text:prompt}]
      : prompt}]};
  }
  let res;
  try{ res = await fetch(url, {method:'POST', headers, body: JSON.stringify(body), signal}); }
  catch(e){
    if (e && e.name === 'AbortError') throw {code:'cancelled'};
    throw {code:'api', message: P.name + '：网络请求失败（网络不通，或该服务不允许网页直接调用），请换一个 AI 试试'};
  }
  const raw = await res.text();
  if (!res.ok){
    let msg = raw; try{ const j = JSON.parse(raw); msg = j.error?.message || j.message || raw; }catch(e){}
    const hint = res.status === 401 || res.status === 403 ? '（API Key 不对或没有权限）' : res.status === 429 ? '（额度用完或请求太频繁）' : res.status === 404 ? '（模型名称可能不对）' : '';
    throw {code:'api', message: P.name + ' 错误 ' + res.status + hint + '：' + String(msg).slice(0, 160)};
  }
  const j = JSON.parse(raw);
  let text = '';
  if (P.type === 'anthropic') text = (j.content || []).filter(x => x.type === 'text').map(x => x.text).join('');
  else if (P.type === 'gemini') text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  else { const m = j.choices?.[0]?.message?.content; text = typeof m === 'string' ? m : (m || []).map(x => x.text || '').join(''); }
  if (!text.trim()) throw {code:'api', message: P.name + ' 没有返回内容，请再试一次'};
  return text;
}
async function callAIJson(prompt, opts = {}){
  const imgs = opts.images ? (Array.isArray(opts.images) ? opts.images : [opts.images]) : [];
  const t = await callAIText(prompt, imgs, opts.signal);
  return parseLoose(t);
}
function parseLoose(t){
  t = t.replace(/```json|```/gi, '').trim();
  try{ return JSON.parse(t); }catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a){ try{ return JSON.parse(t.slice(a, b + 1)); }catch(e){} }
  throw {code:'invalid_json'};
}

function kidKcal(age, sex){
  const boy = [1400,1400,1500,1650,1750,1800,2050,2050,2050,2050,2050,2500,2500,2500,2500,2500,2500,2500];
  const girl= [1250,1250,1350,1450,1550,1700,1800,1800,1800,1800,1800,2000,2000,2000,2000,2000,2000,2000];
  const a = Math.min(17, Math.max(0, Math.round(age||10)));
  return (sex === 'f' ? girl : boy)[a];
}
function calcTargets(p){
  if (!p) return {};
  if (p.mode === 'kid') return {kcal: kidKcal(p.age, p.sex), p:15, f:30, c:55, na: p.age < 11 ? 1500 : 1800};
  const bmr = 10*(+p.w||60) + 6.25*(+p.h||165) - 5*(+p.age||35) + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * (+p.act || 1.375);
  if (p.mode === 'loss'){
    const floor = p.sex === 'f' ? 1200 : 1500;
    return {kcal: Math.round(Math.max(floor, tdee - 500)/10)*10, p:30, f:30, c:40, na:2000};
  }
  return {kcal: Math.round(tdee/10)*10, p:20, f:30, c:50, na:2000};
}

}

function evalDay(t, mealsN){
  const S = settings, gP = S.kcal*S.p/100/4, mode = prof()?.mode;
  const stars = [];
  if (mode === 'loss'){
    if (t.kcal <= S.kcal*1.05 && t.kcal >= S.kcal*0.75) stars.push('热量控制在目标内');
  } else if (t.kcal >= S.kcal*0.85 && t.kcal <= S.kcal*1.1) stars.push('热量刚刚好');
  if (t.p >= gP*0.8) stars.push('蛋白质吃够了');
  if (t.na <= S.na) stars.push('盐没超标');
  const ok = mealsN >= 2 && stars.length >= 2 && stars[0] !== '蛋白质吃够了';
  const tooLow = mode === 'loss' && mealsN >= 2 && t.kcal < S.kcal*0.75;
  return {stars, ok, tooLow};
}

function renderWeight(){

  const last = ws.length ? ws[ws.length-1].kg : start.kg, lost = r1(start.kg - last), need = r1(last - p.tw);
  const recent = ws.slice(-14);
  const mx = Math.max(...recent.map(x => x.kg), start.kg), mn = Math.min(...recent.map(x => x.kg), p.tw);
  const pts = recent.map((x,i) => `${recent.length===1?150:i/(recent.length-1)*300},${mx===mn?40:(mx-x.kg)/(mx-mn)*70+5}`).join(' ');
  $('weightCard').innerHTML = `<h3>体重</h3>
    <div class="rw"><div><b>${last}</b><span>当前 kg</span></div><div><b style="color:var(--g)">${lost > 0 ? '−' + lost : lost < 0 ? '+' + (-lost) : 0}</b><span>已减 kg</span></div><div><b>${need > 0 ? need : '🎯'}</b><span>${need > 0 ? '距目标 kg' : '已达成目标'}</span></div></div>
    ${recent.length > 1 ? `<svg viewBox="0 0 300 80" style="width:100%;height:80px"><polyline points="${pts}" fill="none" stroke="var(--g)" stroke-width="2.5" stroke-linejoin="round"/></svg>` : ''}
    <div class="row" style="margin-top:8px"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="今天体重 kg" class="grow"><button class="btn sm" id="wSave">记录</button></div>
    <div class="tip">建议每周减 0.5–1 kg，每天同一时间（早上起床后）称最准。</div>`;
  $('wSave').onclick = () => {
    const kg = +$('wIn').value; if (!(kg > 20 && kg < 300)) { toast('请输入正确的体重'); return; }
    const list = (local.get('weights') || []).filter(x => x.d !== dateKey(new Date()));
    list.push({d: dateKey(new Date()), kg}); list.sort((x,y) => x.d < y.d ? -1 : 1); local.set('weights', list.slice(-120));
    p.w = kg; local.set('profiles', profiles);

    if (kg <= p.tw && !a.wm.includes('goal')){ a.wm.push('goal'); saveAch(a); celebrate('🏆', '达成目标体重！', `从 ${start.kg} kg 到 ${kg} kg，你做到了！这份坚持值得好好奖励自己一下 🎁（记得换成「健康模式」保持住）`); }
    else {
      const m = Math.floor(lostNow);
      if (m >= 1 && !a.wm.includes('kg' + m)){ a.wm.push('kg' + m); saveAch(a); celebrate('🎉', `已经减掉 ${m} kg！`, pick(['身体正在悄悄变好，继续保持这个节奏！','每一公斤都是你一口一口认真吃出来的成果 💪','了不起！衣服应该开始松一点了吧 😄'])); }
      else toast(kg < last ? '比上次轻了 ' + r1(last - kg) + ' kg 👏' : '已记录。体重有波动很正常，看长期趋势就好');
    }
    renderWeight();
  };
}

/* 手动记一餐 */
$('manualBtn').onclick = () => {
  $('meals').insertAdjacentHTML('afterend', `<div id="manualBox" style="margin-top:10px">
    <textarea id="manualTxt" rows="2" placeholder="例：便利店饭团1个（金枪鱼）+ 无糖绿茶500ml"></textarea>
    <div class="chips" id="mType" style="margin-top:8px"></div>
    <button class="btn" style="margin-top:8px" id="manualGo">估算并记录</button></div>`);
  $('manualBtn').classList.add('hidden');
  let mt = guessMeal();
  const drawT = () => { $('mType').innerHTML = MEALS.map(m => `<button class="chip ${m===mt?'on':''}" data-v="${m}">${m}</button>`).join('');
    $('mType').querySelectorAll('button').forEach(b => b.onclick = () => { mt = b.dataset.v; drawT(); }); };
  drawT();
  $('manualGo').onclick = async () => {
    const txt = $('manualTxt').value.trim(); if (!txt) return;
    
    const b = $('manualGo'); b.disabled = true; b.innerHTML = '<span class="spin"></span>估算中…';
    try{
      const items = await lookupFood(txt); const t = sumNut(items, 1);
      const k = dateKey(viewDate); const day = await getDay(k);
      const ts = dateKey(viewDate) === dateKey(new Date()) ? Date.now() : new Date(viewDate.toDateString()).getTime() + 12*36e5;
      day.meals.push({ id: Date.now().toString(36), ts, type: mt, name: txt, ratio: 1, thumb: '',
        items: items.map(i => ({n:i.name, w:r0(i.w)})),
        t: {kcal:r0(t.kcal), p:r1(t.p), f:r1(t.f), c:r1(t.c), fib:r1(t.fib), na:r0(t.na)} });
      await putDay(k); $('manualBox').remove(); $('manualBtn').classList.remove('hidden'); toast('已记录'); renderDay();
    } catch(e){ toast(errText(e)); b.disabled = false; b.textContent = '估算并记录'; }
  };
};

   设置
   ========================================================= */
function fillSettings(){
  $('sKcal').value = settings.kcal; $('sP').value = settings.p; $('sF').value = settings.f; $('sC').value = settings.c; $('sNa').value = settings.na;
}
$('saveSet').onclick = async () => {
  const p = +$('sP').value, f = +$('sF').value, c = +$('sC').value;
  if (Math.abs(p+f+c-100) > 1){ toast('三项比例加起来要等于 100%'); return; }
  settings = { kcal: +$('sKcal').value || 1800, p, f, c, na: +$('sNa').value || 2000, tier: settings.tier };
  await saveDoc('settings', settings); saveProvForm(); saveProfileForm(false); toast('已保存');
};
